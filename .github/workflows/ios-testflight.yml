# ─────────────────────────────────────────────────────────────────────────────
# ios-testflight.yml — Compila la app iOS "Stratos AI" y la sube a TestFlight
#
# POR QUÉ EXISTE: compilar para iOS necesita Xcode, que son 9.45 GB de descarga
# y ~20 GB en disco, y ata cada release a una Mac concreta. Los runners macOS de
# GitHub ya traen Xcode, así que el release sale de aquí: sin instalar nada
# local y sin depender de quién tenga la Mac a mano.
#
# La app EMPAQUETA el CRM dentro del binario (webDir: ../dist-app), así que abre sin
# red. Los datos siguen viniendo en vivo de Supabase, pero cualquier cambio de la
# interfaz necesita un release nuevo: por eso este workflow se corre también
# cuando cambia el CRM, no solo el shell.
#
# ── SECRETS QUE HAY QUE CARGAR (Settings → Secrets and variables → Actions) ──
#
#   APPLE_TEAM_ID          Team ID de 10 caracteres.
#                          developer.apple.com → Membership details.
#
#   APPSTORE_ISSUER_ID     UUID del emisor de la API key.
#                          App Store Connect → Users and Access → Integrations
#                          → App Store Connect API. Está arriba de la tabla.
#
#   APPSTORE_KEY_ID        Key ID de 10 caracteres de esa misma tabla.
#
#   APPSTORE_PRIVATE_KEY   Contenido COMPLETO del archivo AuthKey_XXXX.p8
#                          (incluyendo las líneas BEGIN/END PRIVATE KEY).
#                          Apple solo deja descargarlo UNA vez: guardarlo.
#                          El rol de la key debe ser "App Manager" o superior,
#                          o el upload a TestFlight se rechaza por permisos.
#
# ── ANTES DE LA PRIMERA CORRIDA ──
#   1. Registrar el Bundle ID com.stratoscapitalgroup.crm en
#      developer.apple.com → Identifiers.
#   2. Crear la app en App Store Connect con ese mismo Bundle ID.
#   Sin esos dos pasos el upload falla aunque compile bien.
#
# El número de build sale de github.run_number: siempre sube, así que App Store
# Connect nunca lo rechaza por repetido.
# ─────────────────────────────────────────────────────────────────────────────
name: iOS TestFlight (Stratos AI móvil)

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Versión visible (ej. 1.0.1). Vacío = deja la del proyecto.'
        required: false
        default: ''

concurrency:
  group: ios-testflight
  cancel-in-progress: false   # nunca cancelar un upload a medias

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60

    env:
      SCHEME: App
      PROJECT: mobile/ios/App/App.xcodeproj
      BUNDLE_ID: com.stratoscapitalgroup.crm

    steps:
      - uses: actions/checkout@v4

      - name: Elegir el Xcode mas nuevo del runner
        run: |
          # Apple RECHAZA el paquete si se compilo con un SDK viejo. La corrida
          # del 25-ago-2026 murio en la validacion con:
          #   "This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps
          #    must be built with the iOS 26 SDK or later, included in Xcode 26
          #    or later, in order to be uploaded to App Store Connect."
          # Pasaba porque /Applications/Xcode.app apunta al que el runner deja
          # enlazado por defecto, que no es el mas nuevo. Se elige explicitamente
          # el mayor por version, para que esto no vuelva a envejecer solo.
          set -eo pipefail
          echo "Xcodes disponibles en el runner:"
          ls -d /Applications/Xcode*.app
          ELEGIDO=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Elegido: $ELEGIDO"
          sudo xcode-select -s "$ELEGIDO"
          xcodebuild -version
          echo "SDKs de iOS disponibles:"
          xcodebuild -showsdks | grep -i ios || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # webDir apunta a ../dist-app: la app ahora EMPAQUETA el CRM en el binario en
      # vez de cargarlo remoto, así que hay que compilar la web antes de sincronizar.
      # build:app excluye del binario la landing, la política de privacidad, los
      # siete manuales y 1.5 MB de estáticos del sitio: 6.7 MB -> 4.5 MB. Apple
      # revisa el contenido del paquete, y un sitio de marketing ahí adentro
      # refuerza justo la lectura de "web enlatada" (Guideline 4.2).
      - name: Compilar el CRM (modo app, sin el sitio web)
        run: |
          npm ci
          npm run build:app

      # CapApp-SPM referencia ../../../node_modules/@capacitor/* — sin esto el
      # paquete de Swift no resuelve y la compilación falla al enlazar plugins.
      - name: Instalar dependencias de Capacitor
        working-directory: mobile
        run: npm ci

      - name: Sincronizar proyecto iOS
        working-directory: mobile
        run: npx cap sync ios

      - name: Preparar la API key de App Store Connect
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          # altool y xcodebuild buscan la key en esta ruta exacta.
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Archivar (firma automática con la API key)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING: ${{ inputs.marketing_version }}
        run: |
          # Sin 'set -u': el bash 3.2 que trae macOS falla al expandir un
          # array vacío con -u activo. GitHub ya corre los steps con -e y
          # pipefail, así que no hace falta repetirlos.
          set -eo pipefail
          ARGS=""
          if [ -n "$MARKETING" ]; then ARGS="MARKETING_VERSION=$MARKETING"; fi
          # shellcheck disable=SC2086  # $ARGS debe separarse en palabras

          # -allowProvisioningUpdates deja que Xcode cree el certificado y el
          # perfil solo, usando la API key. Sin eso habría que exportar el
          # certificado a mano desde una Mac y guardarlo como secret.
          #
          #
          # NO SE FIRMA AL ARCHIVAR, se firma al EXPORTAR. Por que:
          # con CODE_SIGN_STYLE=Automatic, Xcode firma el archivo "para
          # desarrollo" — lo dice el mismo con todas las letras — y un perfil
          # de desarrollo EXIGE al menos un dispositivo registrado en la
          # cuenta. Este equipo no tiene ninguno, y para TestFlight no hace
          # falta que lo tenga. Las dos corridas del 25-ago-2026 murieron aca:
          #   1) "Your team has no devices from which to generate a
          #      provisioning profile" (pedia perfil de desarrollo)
          #   2) al forzar CODE_SIGN_IDENTITY="Apple Distribution":
          #      "App has conflicting provisioning settings. App is
          #       automatically signed for development, but a conflicting
          #       code signing identity Apple Distribution has been manually
          #       specified."
          # La salida: archivar SIN firmar y dejar que -exportArchive firme,
          # que es donde se usa el perfil de DISTRIBUCION — y ese no necesita
          # ningun dispositivo. -allowProvisioningUpdates lo obtiene con la
          # API key en el paso siguiente.
          #
          # Alternativa si esto no alcanza: registrar el UDID de un iPhone en
          # Certificates, Identifiers & Profiles (solo lo puede hacer Ivan) y
          # volver a la firma automatica normal.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $ARGS

      # Paso de MEDICION, no de arreglo. Tras 8 corridas el diagnostico chocaba
      # con una pregunta que nadie habia contestado: que certificados y perfiles
      # quedan REALMENTE instalados en el runner despues de archivar. En manual,
      # xcodebuild solo usa lo que esta instalado, y fallaba con:
      #   "No signing certificate \"iOS Distribution\" found"
      #   "No \"iOS App Store\" profiles ... are installed"
      # Si aparece un certificado de distribucion con otro nombre, se usa ese.
      # Si no aparece ninguno, hace falta uno propio (creado desde un CSR).
      - name: Que quedo instalado en el llavero (diagnostico)
        if: always()
        run: |
          echo "=== identidades de firma disponibles ==="
          security find-identity -v -p codesigning || true
          echo "=== todas las identidades del llavero por defecto ==="
          security find-identity -v || true
          echo "=== perfiles instalados ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "  (no hay carpeta de perfiles)"
          ls -la ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || echo "  (tampoco en UserData)"

      - name: Exportar el .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -eo pipefail
          # ⚠️ FIRMA MANUAL AL EXPORTAR, A PROPOSITO. Con signingStyle automatic,
          # xcodebuild NO vuelve a firmar: reempaqueta lo que salio del archivado,
          # que esta firmado con el certificado de DESARROLLO que la propia firma
          # automatica instala en el llavero del runner. altool lo rechaza:
          #   "Invalid Signature... The file at path App.app/App is not properly
          #    signed. Make sure you have signed your application with a
          #    distribution certificate, not an ad hoc certificate or a
          #    development certificate."
          # Y signingCertificate NO alcanza para arreglarlo en modo automatico:
          # la documentacion de xcodebuild dice "For manual signing only", asi que
          # ahi se ignora en silencio (comprobado: corrida 7 del 25-ago-2026 dio
          # exactamente el mismo error que la 6).
          #
          # En manual hay que nombrar el perfil. El nombre sale de abrir el .ipa
          # de la corrida 6 y leer su embedded.mobileprovision: es el perfil de
          # App Store que Xcode genera solo, y era el CORRECTO (production, sin
          # dispositivos). O sea: el perfil ya estaba bien, faltaba el certificado.
          # -allowProvisioningUpdates baja los dos con la API key (rol Admin).
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.stratoscapitalgroup.crm</key>
              <string>iOS Team Store Provisioning Profile: com.stratoscapitalgroup.crm</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          ls -lh "$RUNNER_TEMP/export"

      - name: Validar antes de subir
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -eo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" -maxdepth 1 | head -1)
          # Falla acá con un mensaje claro en vez de a mitad del upload.
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Subir a TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -eo pipefail
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" -maxdepth 1 | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Subido. App Store Connect tarda ~10-15 min en procesarlo."

      - name: Guardar el .ipa como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stratos-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: ignore

      - name: Guardar logs si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/App.xcarchive
          retention-days: 7
          if-no-files-found: ignore
