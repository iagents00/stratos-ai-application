# ─────────────────────────────────────────────────────────────────────────────
# android-play.yml — Compila el AAB para GOOGLE PLAY de la app "Stratos AI"
#
# QUÉ HACE: a mano ("Run workflow"), compila el App Bundle (.aab) firmado con
# el UPLOAD KEY privado (secretos de GitHub, generado el 28-ago-2026, respaldo
# en ~/StratosKeys de la Mac de Iván) y lo deja como artifact para subirlo a
# la Play Console.
#
# EN QUÉ SE DIFERENCIA de android-apk.yml (que sigue siendo el APK interno):
#   · bundleRelease (AAB) en vez de assembleRelease (APK) — Play solo acepta AAB.
#   · Firma con el upload key privado, NO con testing.keystore (que está
#     commiteado y solo sirve para distribución interna).
#   · -PplayStore → targetSdk 36 (exigencia de Play desde el 31-ago-2026).
#     El edge-to-edge resultante lo margina Capacitor de forma nativa
#     (adjustMarginsForEdgeToEdge en capacitor.config.json) y se valida en la
#     prueba cerrada de Play con los celulares del equipo.
#
# Manual a propósito (workflow_dispatch): cada subida a Play necesita un
# versionCode nuevo en mobile/android/app/build.gradle — subir el número,
# mergear, y correr esto.
# ─────────────────────────────────────────────────────────────────────────────
name: Android AAB para Google Play (Stratos AI móvil)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sin el upload key no hay nada que hacer: mejor un error claro al minuto
      # cero que un AAB firmado con el keystore de pruebas que Play rechaza.
      - name: Verificar que el upload key está cargado
        env:
          KS_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Faltan los secretos ANDROID_UPLOAD_KEYSTORE_B64 y/o ANDROID_UPLOAD_KEYSTORE_PASSWORD. Cargarlos desde ~/StratosKeys (ver LEEME.md ahí)."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"
          ls -l "$RUNNER_TEMP/upload-keystore.p12"

      # Igual que en android-apk.yml: sin GOOGLE_SERVICES_JSON la app compila
      # pero registrar push tumba la app al iniciar sesión (excepción nativa),
      # así que el interruptor es de COMPILACIÓN. El secreto ya está cargado.
      - name: Firebase (solo si la credencial está cargada)
        id: firebase
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > mobile/android/app/google-services.json
            node -e "JSON.parse(require('fs').readFileSync('mobile/android/app/google-services.json','utf8'))" \
              || { echo "::error::GOOGLE_SERVICES_JSON no es un JSON valido"; exit 1; }
            echo "hay=1" >> "$GITHUB_OUTPUT"
          else
            echo "hay=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin GOOGLE_SERVICES_JSON: este AAB NO recibe avisos con la app cerrada."
          fi

      - name: Compilar el CRM (modo app, sin el sitio web)
        env:
          VITE_ANDROID_PUSH: ${{ steps.firebase.outputs.hay }}
        run: |
          npm ci
          npm run build:app

      - name: Instalar dependencias de Capacitor
        working-directory: mobile
        run: npm ci

      - name: Sincronizar proyecto Android
        working-directory: mobile
        run: npx cap sync android

      - name: Compilar AAB (release, firmado con el upload key)
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -PplayStore \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload-keystore.p12" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KS_PASS"

      - name: Preparar AAB
        run: |
          VC=$(grep -E '^\s*versionCode' mobile/android/app/build.gradle | grep -oE '[0-9]+')
          VN=$(grep -E '^\s*versionName' mobile/android/app/build.gradle | grep -oE '[0-9.]+')
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "stratos-ai-play-v$VN-$VC.aab"
          ls -lh stratos-ai-play-*.aab
          echo "### AAB listo para la Play Console" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionName **$VN** · versionCode **$VC** · target 36" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$(sha256sum stratos-ai-play-v$VN-$VC.aab | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir artifact (descargarlo y subirlo a la Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: stratos-ai-play-aab
          path: stratos-ai-play-*.aab
          retention-days: 90
