name: Validar Stratos

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Validar Stratos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run check:project
      - run: npm run check:runtime
      - run: npm run test
      - run: npm run probar-rails
      - run: npm run test:rails-db
      - run: node scripts/check-tenant-modules.mjs
      - run: node scripts/verificar-tenant-route.mjs
      - run: npm run verificar-docs
      - run: npm run verificar-rpc
      - run: npm run ops:check
      - run: npm run verificar-migraciones
      - run: npm run build
      - name: Verificar paquete móvil y acceso de App Review
        run: npm run build:app && npm run verificar:appstore-ios
      - name: Detectar cambios de esquema de Proyectos
        id: project_staging
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/main...HEAD | grep -Eq '^(supabase/migrations/32[67]_|tests/sql/work-projects-|.github/workflows/validate-stratos.yml$)'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v2
        if: steps.project_staging.outputs.enabled == 'true'
        with:
          version: 2.101.0
      - name: Ensayo de Proyectos en Supabase local
        if: steps.project_staging.outputs.enabled == 'true'
        run: |
          project_stage="$(mktemp -d)"
          supabase init --workdir "$project_stage"
          trap 'supabase stop --no-backup --workdir "$project_stage" >/dev/null 2>&1' EXIT
          mkdir -p "$project_stage/supabase/migrations"
          cp tests/sql/work-projects-staging-fixture.sql "$project_stage/supabase/migrations/20260101000000_fixture.sql"
          cp supabase/migrations/32[67]_project_delivery_workspace.sql "$project_stage/supabase/migrations/20260101000001_projects.sql"
          cp supabase/migrations/327_duke_project_account_access.sql "$project_stage/supabase/migrations/20260101000002_duke.sql"
          supabase start --workdir "$project_stage" -x analytics,edge-runtime,imgproxy,inbucket,meta,realtime,storage,studio,vector >/dev/null
          node tests/sql/work-projects-supabase-staging.mjs "$project_stage"
