# ─────────────────────────────────────────────────────────────────────────────
# android-apk.yml — Compila el APK de la app móvil "Stratos AI" (mobile/)
#
# QUÉ HACE: en cada cambio dentro de mobile/** (o a mano con "Run workflow"),
# compila el APK Android firmado con el keystore de pruebas y lo publica en el
# release "android-latest" del repo → descargar e instalar en cualquier Android.
#
# La app EMPAQUETA el CRM dentro del binario (webDir: ../dist), así que abre sin
# red. Los datos siguen viniendo en vivo de Supabase, pero cualquier cambio de la
# interfaz necesita recompilar: por eso este workflow también corre con src/**.
#
# Instalar: GitHub → Releases → "App Android (última)" → stratos-ai.apk
# (Android pide permitir "instalar apps de origen desconocido" la primera vez.)
# ─────────────────────────────────────────────────────────────────────────────
name: Android APK (Stratos AI móvil)

on:
  push:
    branches: [main]
    # ⚠️ Misma lista que ios-testflight.yml. Si cambia una, cambia la otra:
    # dos listas distintas desincronizan las apps sin que nadie lo note.
    paths: ['mobile/**', 'src/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write   # publicar el release con el APK

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # webDir apunta a ../dist: la app ahora EMPAQUETA el CRM en el binario en
      # vez de cargarlo remoto, así que hay que compilar la web antes de sincronizar.
      # build:app excluye del binario la landing, la política de privacidad, los
      # siete manuales y 1.5 MB de estáticos del sitio: 6.7 MB -> 4.5 MB. Apple
      # revisa el contenido del paquete, y un sitio de marketing ahí adentro
      # refuerza justo la lectura de "web enlatada" (Guideline 4.2).
      # Firebase es lo que permite que a un Android le llegue un aviso con la
      # app CERRADA. Si el secreto existe, se escribe el archivo que espera el
      # plugin de Google y se enciende el registro de push en la app.
      #
      # El interruptor es de COMPILACION y no de tiempo de ejecucion a
      # proposito: sin ese archivo, registrar push lanza una excepcion NATIVA
      # ("Default FirebaseApp is not initialized") que el try/catch de
      # JavaScript no atrapa — la app se cierra sola al iniciar sesion, que es
      # justo el fallo que se reporto el 25-ago-2026. No se puede "intentar y
      # ver": para cuando falla, ya se cerro.
      - name: Firebase (solo si la credencial esta cargada)
        id: firebase
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > mobile/android/app/google-services.json
            # Un secreto mal pegado da un archivo que no es JSON: mejor frenar
            # aca que repartir un APK que se cierra al entrar.
            node -e "JSON.parse(require('fs').readFileSync('mobile/android/app/google-services.json','utf8'))"               || { echo "::error::GOOGLE_SERVICES_JSON no es un JSON valido"; exit 1; }
            echo "hay=1" >> "$GITHUB_OUTPUT"
            echo "Firebase configurado: el APK va a recibir avisos con la app cerrada."
          else
            echo "hay=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin GOOGLE_SERVICES_JSON: este APK NO recibe avisos con la app cerrada."
          fi

      - name: Compilar el CRM (modo app, sin el sitio web)
        env:
          VITE_ANDROID_PUSH: ${{ steps.firebase.outputs.hay }}
        run: |
          npm ci
          npm run build:app

      - name: Instalar dependencias de Capacitor
        working-directory: mobile
        run: npm ci

      - name: Sincronizar proyecto Android
        working-directory: mobile
        run: npx cap sync android

      - name: Compilar APK (release, firmado con keystore de pruebas)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk stratos-ai.apk
          ls -lh stratos-ai.apk

      - name: Subir artifact (respaldo por corrida)
        uses: actions/upload-artifact@v4
        with:
          name: stratos-ai-apk
          path: stratos-ai.apk
          retention-days: 30

      - name: Publicar en el release "android-latest" (link fijo de descarga)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest stratos-ai.apk \
            --title "App Android (última) — Stratos AI" \
            --notes "APK de la app móvil Stratos AI (shell que carga el CRM — las actualizaciones del CRM llegan solas). Compilado automáticamente del commit ${GITHUB_SHA::7}. Instalar: descargar stratos-ai.apk en el Android y abrirlo (permitir 'orígenes desconocidos' la primera vez). Firma de pruebas: instala encima de versiones anteriores sin desinstalar."
