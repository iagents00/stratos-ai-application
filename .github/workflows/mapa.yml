# ─────────────────────────────────────────────────────────────────────────────
# mapa.yml — Mantiene MAPA.md y PLANO.md sincronizados con el código
#
# POR QUÉ: un mapa escrito a mano envejece y termina mandándote al archivo
# equivocado. Este workflow los regenera en cada push a main y commitea el
# resultado si cambió, así nadie tiene que acordarse de correrlos.
# ─────────────────────────────────────────────────────────────────────────────
name: Planos del código

on:
  push:
    branches: [main]
    paths: ['src/**', 'n8n/**', 'mobile/**', 'scripts/generar-*.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerar los planos
        run: |
          node scripts/generar-mapa.mjs
          node scripts/generar-plano.mjs

      - name: Commitear si cambiaron
        run: |
          if git diff --quiet MAPA.md PLANO.md; then
            echo "Los planos ya estaban al día."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAPA.md PLANO.md
          git commit -m "docs(planos): regenerar MAPA.md y PLANO.md [skip ci]"
          git push
