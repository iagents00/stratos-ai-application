    <style>
      :root {
        color-scheme: light;
        --paper: #fbfaf7;
        --paper-strong: #ffffff;
        --ink: #111111;
        --muted: #7c8288;
        --gold: #b8945c;
        --line: rgba(17, 17, 17, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        overflow-x: hidden;
      }

      @keyframes cta-breathe {
        0%, 78%, 100% {
          transform: translateY(0) scale(1);
          box-shadow: 0 14px 34px rgba(17, 17, 17, 0.14);
        }

        88% {
          transform: translateY(-1px) scale(1.006);
          box-shadow: 0 18px 42px rgba(17, 17, 17, 0.18);
        }
      }

      @keyframes arrow-drift {
        0%, 72%, 100% { transform: translateX(0); }
        84% { transform: translateX(3px); }
      }

      .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(251, 250, 247, 0.98) 45%, #f7f3ec 100%);
      }

      .brand-panel {
        width: min(100%, 980px);
        padding: clamp(28px, 3.8vw, 50px) 24px clamp(20px, 2.5vw, 30px);
        text-align: center;
      }

      .brand {
        margin: 0;
        font-family: Didot, "Bodoni 72", "Bodoni 72 Smallcaps", Georgia, serif;
        font-size: clamp(31px, 6.3vw, 58px);
        font-weight: 400;
        letter-spacing: clamp(0.14em, 0.8vw, 0.28em);
        line-height: 1.08;
      }

      .hero-wrap {
        width: min(calc(100% - 40px), 800px);
        aspect-ratio: 1.58;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid rgba(17, 17, 17, 0.08);
        border-radius: clamp(18px, 3vw, 28px);
        box-shadow: 0 18px 48px rgba(70, 58, 36, 0.12);
      }

      .hero-image {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
      }

      .content {
        width: min(100%, 920px);
        padding: clamp(28px, 3.6vw, 42px) clamp(22px, 5vw, 68px) clamp(42px, 5vw, 68px);
        text-align: center;
      }

      h1 {
        max-width: 640px;
        margin: 0 auto;
        font-family: Didot, "Bodoni 72", Georgia, serif;
        font-size: clamp(38px, 5vw, 68px);
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: 0;
      }

      h1 span {
        display: block;
        white-space: nowrap;
      }

      .gold-rule {
        width: 64px;
        height: 1px;
        margin: clamp(20px, 3vw, 28px) auto clamp(18px, 2.6vw, 26px);
        background: rgba(184, 148, 92, 0.8);
      }

      .copy {
        max-width: 680px;
        margin: 0 auto;
        color: var(--muted);
        font-size: clamp(20px, 3.3vw, 30px);
        line-height: 1.32;
        letter-spacing: 0;
      }

      .cta {
        width: min(100%, 580px);
        min-height: clamp(58px, 7vw, 70px);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 4vw, 32px);
        margin: clamp(24px, 3.4vw, 34px) auto 0;
        padding: 0 clamp(20px, 5vw, 42px);
        border: 1px solid #111111;
        border-radius: 8px;
        background: linear-gradient(145deg, #101010 0%, #1b1b1b 100%);
        box-shadow: 0 14px 34px rgba(17, 17, 17, 0.14);
        color: #ffffff;
        font-size: clamp(19px, 3vw, 28px);
        font-weight: 650;
        line-height: 1.1;
        text-decoration: none;
        transform-origin: center;
        transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        animation: cta-breathe 5.6s ease-in-out infinite;
      }

      .cta:hover {
        background: #242424;
        transform: translateY(-1px);
        box-shadow: 0 18px 42px rgba(17, 17, 17, 0.18);
      }

      .cta:active {
        transform: translateY(0) scale(0.99);
      }

      .cta svg {
        width: clamp(27px, 4vw, 36px);
        height: clamp(27px, 4vw, 36px);
        flex: 0 0 auto;
        animation: arrow-drift 5.6s ease-in-out infinite;
      }

      .cta span {
        min-width: 0;
      }

      .assurance {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-top: 28px;
        color: #8a9094;
        font-size: clamp(17px, 3.4vw, 26px);
        line-height: 1;
      }

      .assurance svg {
        width: 24px;
        height: 24px;
      }

      footer {
        width: min(100%, 860px);
        margin-top: clamp(54px, 7vw, 78px);
        padding-top: 35px;
        border-top: 1px solid var(--line);
        color: #858b90;
        font-size: clamp(15px, 2.6vw, 22px);
        line-height: 1.8;
        text-align: center;
      }

      footer a {
        color: inherit;
        text-decoration: none;
      }

      footer a:hover {
        color: #111111;
      }

      @media (max-width: 560px) {
        .brand-panel {
          padding-top: 28px;
          padding-bottom: 18px;
        }

        .brand {
          white-space: nowrap;
          font-size: clamp(24px, 6.6vw, 30px);
          letter-spacing: 0.14em;
        }

        .hero-image {
          object-position: 43% center;
        }

        .content {
          padding-top: 36px;
          padding-right: 16px;
          padding-left: 16px;
        }

        h1 {
          font-size: clamp(34px, 9.4vw, 42px);
        }

        .cta {
          width: 100%;
          min-height: 60px;
          margin-top: 22px;
          justify-content: space-between;
          text-align: left;
          gap: 14px;
          padding: 0 18px;
          box-shadow: 0 16px 36px rgba(17, 17, 17, 0.22);
          font-size: 17px;
        }

        .cta span {
          white-space: nowrap;
        }

      }

      @media (min-width: 561px) and (max-width: 920px) {
        .brand-panel {
          padding-top: 56px;
          padding-bottom: 36px;
        }

        .hero-wrap {
          width: min(calc(100% - 40px), 780px);
        }

        .content {
          padding-top: 42px;
        }

        h1 {
          font-size: clamp(46px, 7vw, 64px);
        }

        .copy {
          font-size: clamp(23px, 4vw, 32px);
        }

        .cta {
          width: min(100%, 760px);
          max-width: 760px;
          min-height: 68px;
          margin-top: 30px;
          justify-content: space-between;
          box-shadow: 0 18px 42px rgba(17, 17, 17, 0.22);
          font-size: clamp(20px, 3vw, 26px);
        }

        .cta svg {
          width: 34px;
          height: 34px;
        }
      }

      @media (max-width: 360px) {
        .brand {
          font-size: 22px;
          letter-spacing: 0.12em;
        }

        h1 {
          font-size: 30px;
        }

        .cta {
          width: 100%;
          min-height: 58px;
          gap: 10px;
          padding: 0 16px;
          font-size: 15px;
        }

        .cta svg {
          width: 24px;
          height: 24px;
        }
      }

      @media (min-width: 1200px) {
        .brand-panel {
          padding-top: 52px;
        }

        .hero-wrap {
          width: min(calc(100% - 64px), 800px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cta,
        .cta svg {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="brand-panel" aria-label="Duke del Caribe">
        <p class="brand">DUKE DEL CARIBE</p>
      </section>

      <div class="hero-wrap">
        <img
          class="hero-image"
          src="/duke/desarrollos-97k/duke-riviera-hero.jpg"
          srcset="
            /duke/desarrollos-97k/duke-riviera-hero-1000.jpg 1000w,
            /duke/desarrollos-97k/duke-riviera-hero.jpg      1728w
          "
          sizes="(max-width: 767px) calc(100vw - 42px), 800px"
          alt="Terraza residencial frente al mar en Riviera Maya"
          width="1728"
          height="1122"
          fetchpriority="high"
        />
      </div>

      <section class="content">
        <h1>
          <span>Invertir con</span>
          <span>inteligencia</span>
        </h1>
        <div class="gold-rule" aria-hidden="true"></div>
        <p class="copy">Oportunidades desde USD $97,000 en Cancún, Playa del Carmen y Tulum.</p>

        <a class="cta" id="moreInfo" href="https://wa.me/529848763357" rel="nofollow noopener">
          <span>Quiero conocer las opciones</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>

        <div class="assurance" aria-label="Sin compromiso">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6" />
            <path d="M8 10V7.8C8 5.45 9.6 4 12 4s4 1.45 4 3.8V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span>Sin compromiso</span>
        </div>

        <footer>
          <a href="/politica-de-privacidad">Aviso de privacidad</a><br />
          © 2026 Duke del Caribe · Stratos Capital Group
        </footer>
      </section>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        // Espejo del pool `duke_ads_round_robin` en Supabase. Si cambia un
        // teléfono allá, cambiarlo aquí: esta página no consulta la BD.
        var phoneByAdvisor = {
          marco: "529848763357",
          ken: "529842181660",
          carlos: "529841794415"
        };
        var advisor = (params.get("advisor") || params.get("asesor") || "marco").toLowerCase();
        var phone = phoneByAdvisor[advisor] || phoneByAdvisor.marco;
        var message = [
          "Hola, quiero invertir inteligentemente en Riviera Maya.",
          "Me gustaría conocer las opciones de Duke del Caribe."
        ].join("\n");
        document.getElementById("moreInfo").href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
      })();
    </script>
