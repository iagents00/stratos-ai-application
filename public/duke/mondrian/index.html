    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        // Espejo del pool en Supabase. Si cambia un teléfono allá, cambiarlo aquí.
        var phoneByAdvisor = {
          marco: "529848763357",
          ken: "529842181660",
          carlos: "529841794415",
          duke: "529841376686" // numero de la casa (Oscar Galvez)
        };
        var advisor = (params.get("advisor") || params.get("asesor") || "marco").toLowerCase();
        var phone = phoneByAdvisor[advisor] || phoneByAdvisor.marco;
        // Cada asesor tiene su propia campana en Meta. El nombre se arma con el
        // asesor en vez de venir fijo, porque antes todos los clics — los de
        // Marco y los de Ken — se registraban bajo la misma etiqueta y la
        // atribucion por campana no servia para nada.
        var campaign = params.get("utm_campaign") ||
          ("Mondrian Stratos AI - " + advisor.charAt(0).toUpperCase() + advisor.slice(1));
        var message = [
          "Hola, quiero invertir inteligentemente en Riviera Maya.",
          "Vi el anuncio de Mondrian y me gustaría conocerlo."
        ].join("\n");
        var waUrl = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

        var cta = document.getElementById("moreInfo");
        cta.href = waUrl;

        // Esta landing no pide datos, así que el clic ES la conversión: se
        // registra en Stratos para no perder la atribución, y se le avisa a
        // Meta para que pueda optimizar por ella.
        cta.addEventListener("click", function () {
          try { if (window.fbq) fbq("track", "Lead", { content_name: "Mondrian Riviera Maya", content_category: "Duke del Caribe" }); } catch (e) {}
          try {
            var payload = JSON.stringify({
              event: "whatsapp_click",
              advisor: advisor,
              project: "Mondrian",
              campaign: campaign,
              landing_path: window.location.pathname,
              page_url: window.location.href,
              referrer: document.referrer || "",
              utm_source: params.get("utm_source") || "",
              utm_medium: params.get("utm_medium") || "",
              utm_campaign: params.get("utm_campaign") || "",
              utm_content: params.get("utm_content") || "",
              utm_term: params.get("utm_term") || "",
              fbclid: params.get("fbclid") || ""
            });
            // sendBeacon no retrasa la salida a WhatsApp.
            var url = "https://glulgyhkrqpykxmujodb.supabase.co/functions/v1/duke-lead-router";
            if (navigator.sendBeacon) {
              // text/plain a proposito: application/json no esta en la lista
              // segura de CORS y obliga a un preflight que sendBeacon no puede
              // hacer, asi que el navegador descarta el envio en silencio.
              // La Edge Function parsea el body sin mirar el content-type.
              navigator.sendBeacon(url, new Blob([payload], { type: "text/plain;charset=UTF-8" }));
            } else {
              fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: payload, keepalive: true });
            }
          } catch (e) {}
        });
      })();
    </script>
