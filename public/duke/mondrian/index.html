    <script>

      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,

    <style>
      :root {
        color-scheme: light;
        --paper: #fbfaf7;
        --paper-strong: #ffffff;
        --ink: #111111;
        --muted: #7c8288;
        --gold: #b8945c;
        --line: rgba(17, 17, 17, 0.12);
        --error: #b42318;
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body { overflow-x: hidden; }

      .page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(251, 250, 247, 0.98) 45%, #f7f3ec 100%);
      }

      .brand-panel {
        width: min(100%, 980px);
        padding: clamp(22px, 3vw, 40px) 24px clamp(14px, 1.8vw, 22px);
        text-align: center;
      }

      .brand {
        margin: 0;
        font-family: Didot, "Bodoni 72", "Bodoni 72 Smallcaps", Georgia, serif;
        font-size: clamp(24px, 5vw, 44px);
        font-weight: 400;
        letter-spacing: clamp(0.14em, 0.8vw, 0.28em);
        line-height: 1.08;
      }

      .hero-wrap {
        width: min(calc(100% - 40px), 560px);
        aspect-ratio: 2.6;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid rgba(17, 17, 17, 0.08);
        border-radius: clamp(14px, 2.4vw, 22px);
        box-shadow: 0 14px 36px rgba(70, 58, 36, 0.12);
      }

      .hero-image {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center 62%;
      }

      .content {
        width: min(calc(100% - 40px), 560px);
        padding: clamp(20px, 3.2vw, 30px) 0 36px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: Didot, "Bodoni 72", Georgia, serif;
        font-weight: 400;
        font-size: clamp(28px, 6.4vw, 42px);
        line-height: 1.06;
        letter-spacing: -0.005em;
      }

      .gold-rule {
        width: 96px;
        height: 1px;
        margin: clamp(14px, 2.2vw, 20px) auto;
        background: var(--gold);
        opacity: 0.85;
      }

      .copy {
        margin: 0 0 clamp(18px, 2.8vw, 26px);
        color: var(--muted);
        font-size: clamp(15px, 3.6vw, 18px);
        line-height: 1.45;
      }

      form { display: grid; gap: 12px; text-align: left; }

      label {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #25323d;
      }

      input, select {
        width: 100%;
        min-height: 50px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper-strong);
        color: var(--ink);
        font: inherit;
        font-size: 16px; /* 16px evita el zoom automático de iOS al enfocar */
      }

      input:focus-visible, select:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
        border-color: transparent;
      }

      .hp {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .cta {
        width: 100%;
        min-height: 56px;
        margin-top: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #111111;
        color: #ffffff;
        font: inherit;
        font-size: clamp(15px, 3.4vw, 17px);
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 14px 34px rgba(17, 17, 17, 0.14);
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      }

      .cta:hover { transform: translateY(-1px); box-shadow: 0 18px 42px rgba(17, 17, 17, 0.18); }
      .cta[disabled] { opacity: 0.62; cursor: progress; transform: none; }
      .cta svg { width: 22px; height: 22px; flex: none; }

      .status {
        margin: 12px 0 0;
        min-height: 20px;
        font-size: 14px;
        line-height: 1.45;
        color: var(--error);
      }

      .status[data-tone="info"] { color: var(--muted); }

      .assurance {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .assurance svg { width: 15px; height: 15px; }

      footer {
        margin-top: 26px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
        text-align: center;
      }

      footer a { color: inherit; }

      @media (prefers-reduced-motion: reduce) {
        .cta { transition: none; }
        .cta:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="brand-panel" aria-label="Duke del Caribe">
        <p class="brand">DUKE DEL CARIBE</p>
      </section>

      <div class="hero-wrap">
        <img
          class="hero-image"
          src="/duke/mondrian/hero.jpg"
          alt="Terraza residencial frente al mar en Riviera Maya"
          width="1000"
          height="649"
          fetchpriority="high"
        />
      </div>

      <section class="content">
        <h1>Mondrian<br />Riviera Maya</h1>
        <div class="gold-rule" aria-hidden="true"></div>
        <p class="copy">Déjanos tus datos y te enviamos la información por WhatsApp.</p>

        <form id="leadForm" novalidate>
          <label>
            Nombre completo
            <input id="name" name="name" type="text" autocomplete="name" required placeholder="Tu nombre" />
          </label>

          <label>
            WhatsApp
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder="+52 984 000 0000" />
          </label>

          <label>
            Email <span style="font-weight:400;color:var(--muted)">(opcional)</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" />
          </label>

          <label>
            Ciudad de interés
            <select id="city" name="city" required>
              <option value="">Elige una</option>
              <option>Cancún</option>
              <option>Playa del Carmen</option>
              <option>Tulum</option>
              <option>Cualquiera de las 3</option>
            </select>
          </label>

          <!-- Honeypot: los bots la llenan, las personas no la ven. -->
          <input class="hp" type="text" id="company_website" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true" />

          <button class="cta" id="submitBtn" type="submit">
            <span id="submitLabel">Recibir opciones por WhatsApp</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <div class="assurance">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6" />
            <path d="M8 10V7.8C8 5.45 9.6 4 12 4s4 1.45 4 3.8V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span>Sin compromiso</span>
        </div>

        <footer>
          <a href="/politica-de-privacidad">Aviso de privacidad</a><br />
          © 2026 Duke del Caribe · Stratos Capital Group
        </footer>
      </section>
    </main>

    <script>
      (function () {
        var ENDPOINT = "https://glulgyhkrqpykxmujodb.supabase.co/functions/v1/duke-lead-router";

        var form = document.getElementById("leadForm");
        var btn = document.getElementById("submitBtn");
        var label = document.getElementById("submitLabel");
        var status = document.getElementById("status");
        var params = new URLSearchParams(window.location.search);

        // Mensajes del router traducidos. Cualquier otro código cae en el genérico.
        var ERRORES = {
          name_required: "Escribe tu nombre para continuar.",
          phone_required: "Revisa tu WhatsApp: necesitamos 10 dígitos.",
          city_required: "Elige la ciudad que te interesa.",
          bad_json: "No pudimos leer tus datos. Intenta de nuevo.",
          advisor_phone_missing: "Recibimos tus datos. Un asesor te contacta en breve."
        };

        function decir(mensaje, tono) {
          status.textContent = mensaje || "";
          status.setAttribute("data-tone", tono || "error");
        }

        function ocupado(si) {
          btn.disabled = si;
          label.textContent = si ? "Enviando…" : "Recibir opciones por WhatsApp";
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          decir("");

          var payload = {
            name: document.getElementById("name").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            email: document.getElementById("email").value.trim(),
            city: document.getElementById("city").value,
            company_website: document.getElementById("company_website").value,
            source: "stratos_landing_duke_mondrian",
            campaign: "Duke Mondrian - Marco - Lead Ads",
            project: "Mondrian",
            tag: "Mondrian",
            page_url: window.location.href,
            landing_path: window.location.pathname,
            // Asignación DIRECTA a Marco, no carrusel: el lead debe llegar a su
            // WhatsApp y quedar en su cuenta de Stratos. ?advisor= lo puede
            // sobrescribir si algún día se reparte entre varios asesores.
            advisor: params.get("advisor") || params.get("asesor") || "marco",
            utm_source: params.get("utm_source") || "",
            utm_medium: params.get("utm_medium") || "",
            utm_campaign: params.get("utm_campaign") || "",
            utm_content: params.get("utm_content") || "",
            utm_term: params.get("utm_term") || "",
            fbclid: params.get("fbclid") || ""
          };

          if (!payload.name || payload.name.length < 2) return decir(ERRORES.name_required);
          if (payload.phone.replace(/\D/g, "").length < 10) return decir(ERRORES.phone_required);
          if (!payload.city) return decir(ERRORES.city_required);

          ocupado(true);

          fetch(ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              if (data && data.ok && data.wa_url) {
                // El lead ya quedó en el CRM con asesor asignado; mandamos al WhatsApp.
                // Lead confirmado por el router: se lo avisamos a Meta para que
                // pueda optimizar por leads reales, no por visitas.
                try { if (window.fbq) fbq('track', 'Lead', { content_name: 'Mondrian Riviera Maya', content_category: 'Duke del Caribe' }); } catch (e) {}
                decir("Listo. Te llevamos a WhatsApp…", "info");
                window.location.href = data.wa_url;
                return;
              }
              if (data && data.ok && data.ignored) {
                decir("Listo. Te contactamos en breve.", "info");
                return;
              }
              ocupado(false);
              var code = data && (typeof data.error === "string" ? data.error : null);
              decir(ERRORES[code] || "No pudimos enviarlo. Revisa tus datos e intenta de nuevo.");
            })
            .catch(function () {
              ocupado(false);
              decir("Sin conexión. Revisa tu internet e intenta de nuevo.");
            });
        });
      })();
    </script>
  </body>
</html>
