    <!-- ─── [guard:FORCE-MOBILE] Blindaje: teléfono que reporta ancho de ESCRITORIO ───
         Un iPhone puede reportar window.innerWidth > 768 por: (a) Safari en
         "Solicitar sitio para computadora" (~980px), (b) un <meta viewport>
         viejo/ausente en el HTML cacheado del ícono de inicio → iOS cae al
         default de 980px, o (c) el zoom de página al 50%. En cualquiera de esos
         casos la app caía al layout de ESCRITORIO en un celular (le pasó a Iván
         con su iPhone, NO a Ángel). El lado corto FÍSICO de la pantalla (min de
         screen) NO lo cambian esos modos: ≤500px = teléfono. Cuando ES un
         teléfono Y reporta ancho de escritorio (>768), marcamos data-force-mobile
         en <html> ANTES del primer render → el CSS del shell y el JS (useViewport)
         aplican el layout móvil. NO afecta teléfonos sanos en vertical (<768) ni
         PC (pantalla grande / sin táctil). Reversible: borrar este bloque + su
         bloque CSS en App.jsx + isPhoneHardware() en useViewport.js. -->
    <script>
      (function () {
        function isPhoneHardware() {
          try {
            var touch = (navigator.maxTouchPoints || 0) > 0 ||
              (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            var s = window.screen || {};
            var minSide = Math.min(s.width || Infinity, s.height || Infinity);
            return !!touch && minSide > 0 && minSide <= 500;
          } catch (e) { return false; }
        }
        function apply() {
          try {
            var el = document.documentElement;
            if (isPhoneHardware() && window.innerWidth > 768) {
              el.setAttribute('data-force-mobile', '1');
              // Best-effort: si el viewport quedó inflado por un meta viejo/ausente
              // en el HTML cacheado, re-afirmar device-width (PRESERVANDO
              // viewport-fit=cover del fix de letterbox). En modo "sitio de
              // escritorio" Safari lo ignora → no hace daño. Solo actúa si falta.
              var vp = document.querySelector('meta[name="viewport"]');
              if (vp && (vp.getAttribute('content') || '').indexOf('width=device-width') === -1) {
                vp.setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover');
              }
            } else {
              el.removeAttribute('data-force-mobile');
            }
          } catch (e) {}
        }
        apply();
        window.addEventListener('resize', apply, { passive: true });
        window.addEventListener('orientationchange', function () { setTimeout(apply, 120); });
        window.addEventListener('load', apply);
      })();
    </script>

    <!-- ─── [guard:RELOAD-ARBITER] EL ÚNICO QUE PUEDE RECARGAR LA APP ─────────
         Reporte de Ángel/Iván (05-ago): «la abro en la Mac o en el iPhone y se
         recarga varias veces sola, como lageada, y después ya entra».

         La causa NO era una sola: eran TRES sistemas de auto-recarga que no se
         conocían entre sí y se encadenaban.
           1. El Service Worker: en cada deploy avisaba y la app se recargaba.
           2. Este vigilante de pantalla en blanco.
           3. La recuperación de chunk viejo (src/lib/chunk-recovery.js).
         Cada uno llevaba su propio contador, así que "una sola recarga" para
         cada uno eran TRES seguidas para el usuario — y encima la #1 vaciaba el
         caché, con lo que la #2 tardaba más y disparaba a la #3.

         Ahora hay UN SOLO PRESUPUESTO de recargas automáticas, compartido por
         todos y guardado en localStorage (sessionStorage NO servía: la PWA del
         iPhone empieza sesión nueva en cada apertura, así que el freno se
         perdía justo donde más falta hacía). Máximo 2 recargas automáticas en
         90 segundos; de ahí en más se le muestra un mensaje al usuario en vez
         de seguir girando.

         Además marca cada recarga como PROPIA, para que el detector de crash de
         más abajo no las confunda con caídas de Safari y no clave la app en
         "modo seguro" 48h por un problema que causamos nosotros.

         Nunca toca localStorage de la sesión → la sesión de Supabase se conserva. -->
    <script>
      (function () {
        var PRESUP = "stratos_reload_budget_v1";  // { t: primer intento, n: cuántos }
        var PROPIA = "stratos_reload_self_at";    // marca "esta recarga la pedimos nosotros"
        var VENTANA_MS = 90000;
        var MAX_AUTO = 2;

        function leer() {
          try { return JSON.parse(localStorage.getItem(PRESUP) || "null") || null; } catch (e) { return null; }
        }
        function guardar(v) { try { localStorage.setItem(PRESUP, JSON.stringify(v)); } catch (e) {} }

        // ¿Cuántas recargas automáticas quedan en la ventana actual?
        function quedan() {
          var b = leer(), now = Date.now();
          if (!b || (now - b.t) > VENTANA_MS) return MAX_AUTO;
          return Math.max(0, MAX_AUTO - (b.n || 0));
        }

        // Se llama cuando la app arranca BIEN: se devuelve el presupuesto entero.
        function reiniciar() {
          try { localStorage.removeItem(PRESUP); } catch (e) {}
        }

        function limpiarCachesYSW() {
          var p = Promise.resolve();
          try {
            if (typeof caches !== "undefined") {
              p = caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              });
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              p = p.then(function () { return navigator.serviceWorker.getRegistrations(); })
                   .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); });
            }
          } catch (e) {}
          return p.catch(function () {});
        }

        // Pide una recarga. Devuelve false si el presupuesto se agotó (el que
        // llama debe mostrarle algo al usuario en vez de insistir).
        //   motivo → solo para diagnóstico (queda en window.__stratosReloadMotivo)
        //   duro   → además borra cachés y desregistra el SW antes de recargar
        //   forzada→ pedida por el usuario (botón): no consume presupuesto
        function pedirRecarga(motivo, duro, forzada) {
          if (!forzada && quedan() <= 0) return false;
          if (!forzada) {
            var b = leer(), now = Date.now();
            if (!b || (now - b.t) > VENTANA_MS) b = { t: now, n: 0 };
            b.n = (b.n || 0) + 1;
            guardar(b);
          }
          try {
            localStorage.setItem(PROPIA, String(Date.now()));
            window.__stratosReloadMotivo = motivo || "";
          } catch (e) {}
          var destino = location.pathname + location.search + location.hash;
          if (duro) limpiarCachesYSW().then(function () { location.replace(destino); });
          else location.replace(destino);
          return true;
        }

        // ¿La carga que se está ejecutando viene de una recarga PEDIDA POR NOSOTROS?
        // (se consume: solo vale para el arranque inmediatamente siguiente)
        function veniaDeRecargaPropia() {
          try {
            var t = +localStorage.getItem(PROPIA) || 0;
            if (!t) return false;
            localStorage.removeItem(PROPIA);
            return (Date.now() - t) < 60000;
          } catch (e) { return false; }
        }

        window.__stratosReload        = pedirRecarga;
        window.__stratosReloadQuedan  = quedan;
        window.__stratosReloadOk      = reiniciar;
        window.__stratosLimpiarCaches = limpiarCachesYSW;
        window.__stratosRecargaPropia = veniaDeRecargaPropia();
      })();
    </script>

    <!-- ─── [guard:BOOT-BLANK] LA PANTALLA NEGRA DEL IPHONE ───────────────────
         Reporte de Ángel (27-jul, con captura): «a veces me meto a la app en el
         iPhone y se pone negro y no inicia».

         Por qué pasa: la app se instala en la pantalla de inicio (PWA) y iOS la
         SUSPENDE. Cuando volvés, o cuando desplegamos mientras la tenías abierta,
         puede quedar un index.html que apunta a un archivo .js que ya cambió de
         nombre. Ese archivo no carga → React NUNCA monta → no hay ErrorBoundary,
         no hay chunk-recovery, no corre NADA de la app: solo queda el fondo, que
         es casi negro. Por eso la recuperación tiene que vivir ACÁ, en un script
         suelto del HTML: es lo único que se ejecuta en ese escenario.

         ⚠️ CORREGIDO 05-ago-2026 — este vigilante estaba recargando apps SANAS.
         Miraba si <div id="root"> tenía hijos para decidir "arrancó / se colgó".
         Pero root queda VACÍO A PROPÓSITO mientras baja el chunk grande de la
         app (main.jsx lo envuelve en `<Suspense fallback={null}>`): o sea que
         "todavía está cargando" y "se murió" se veían EXACTAMENTE IGUAL. Con la
         señal de 3 segundos del visibilitychange eso era una recarga casi
         garantizada en cualquier conexión lenta. Ahora mira una señal REAL de
         que React montó (window.__STRATOS_BOOT__, lo pone main.jsx) y espera
         tiempos de celular en 3G, no de fibra. -->
    <script>
      (function () {
        var ESPERA_MS = 20000;   // margen amplio: un iPhone viejo en 3G tarda
        var ESPERA_VUELTA_MS = 9000; // al volver a la app suspendida

        // Señal REAL de arranque: React montó (main.jsx → <BootSignal/>).
        // El chequeo de hijos de #root queda como red de seguridad por si algún
        // día se sirve un HTML viejo cacheado sin esa señal.
        function montada() {
          if (window.__STRATOS_BOOT__) return true;
          var r = document.getElementById("root");
          return !!(r && r.childElementCount > 0);
        }

        function avisar() {
          if (document.getElementById("stratos-blank-aviso")) return;
          var d = document.createElement("div");
          d.id = "stratos-blank-aviso";
          d.setAttribute("style",
            "position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;" +
            "align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;" +
            "background:#060A11;color:#E2E8F0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;");
          d.innerHTML =
            '<div style="font-size:17px;font-weight:600">La app no terminó de abrir</div>' +
            '<div style="font-size:14px;opacity:.7;max-width:300px;line-height:1.5">' +
            'Suele pasar cuando el celular guardó una versión vieja. Tocá el botón y se baja de nuevo.</div>' +
            '<button id="stratos-blank-btn" style="margin-top:6px;padding:13px 26px;border:none;border-radius:999px;' +
            'background:#6EE7C2;color:#04211A;font-size:15px;font-weight:700">Volver a intentar</button>';
          document.body.appendChild(d);
          var b = document.getElementById("stratos-blank-btn");
          if (b) b.addEventListener("click", function () {
            // Pedida por el usuario: limpieza dura y sin gastar presupuesto.
            window.__stratosReload("boton-usuario", true, true);
          });
        }

        function revisar(duro) {
          if (montada()) { window.__stratosReloadOk(); return; }
          // 1ª y 2ª van por el árbitro (presupuesto compartido con el resto).
          // La 2ª es dura: limpia cachés y SW.
          var quedan = window.__stratosReloadQuedan();
          if (quedan <= 0) { avisar(); return; }
          if (!window.__stratosReload("boot-blank", duro || quedan === 1)) avisar();
        }

        // (a) el bundle no llegó a montar en un tiempo razonable
        window.addEventListener("load", function () { setTimeout(function () { revisar(false); }, ESPERA_MS); });

        // Arranque sano confirmado → se devuelve el presupuesto de recargas.
        window.addEventListener("stratos:mounted", function () { window.__stratosReloadOk(); });

        // (b) el .js principal devolvió 404 → no hay por qué esperar
        window.addEventListener("error", function (ev) {
          var t = ev && ev.target;
          if (t && t.tagName === "SCRIPT" && String(t.src || "").indexOf("/assets/") >= 0 && !montada()) {
            // Un 404 de un chunk SÍ es un caché viejo: limpieza dura de una.
            setTimeout(function () { revisar(true); }, 600);
          }
        }, true);

        // (c) iOS devuelve la PWA suspendida con la vista en blanco.
        // 9s y no 3s: en 3 segundos una app que está bajando su bundle todavía
        // NO montó, y se la recargaba sin motivo (era el disparador principal).
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden && !montada()) setTimeout(function () { revisar(false); }, ESPERA_VUELTA_MS);
        });
        window.addEventListener("pageshow", function (ev) {
          if (ev && ev.persisted && !montada()) setTimeout(function () { revisar(false); }, ESPERA_VUELTA_MS);
        });
      })();
    </script>

    <!-- ─── [guard:BOOT-SPLASH] QUE NO SE VEA UN AGUJERO NEGRO MIENTRAS CARGA ──
         Mientras baja el chunk de la app, <div id="root"> está vacío y la
         pantalla es un rectángulo casi negro: eso es lo que se siente como
         "lageado / no responde" y lo que empuja a la gente a recargar a mano.
         Este splash es HTML puro (no espera a ningún .js) y se va solo apenas
         la app pinta su primer contenido. Reversible: borrar este bloque. -->
    <script>
      (function () {
        var tema = "dark";
        try { tema = localStorage.getItem("stratos_crm_theme") || "dark"; } catch (e) {}
        try { document.documentElement.setAttribute("data-theme", tema); } catch (e) {}
        var claro = tema === "light";
        var fondo = claro ? "#F1F3F6" : "#060A11";
        var tinta = claro ? "#1F2937" : "#E2E8F0";
        var menta = "#6EE7C2";

        var s = document.createElement("div");
        s.id = "stratos-splash";
        s.setAttribute("style",
          "position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;" +
          "align-items:center;justify-content:center;gap:18px;background:" + fondo + ";" +
          "color:" + tinta + ";font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;" +
          "transition:opacity .28s ease");
        s.innerHTML =
          '<div style="font-size:19px;font-weight:600;letter-spacing:.3px">Stratos<span style="color:' + menta + '"> AI</span></div>' +
          '<div style="width:132px;height:2px;border-radius:2px;overflow:hidden;background:rgba(110,231,194,.16)">' +
          '<div id="stratos-splash-bar" style="width:38%;height:100%;border-radius:2px;background:' + menta + ';' +
          'animation:stratosSplash 1.15s ease-in-out infinite"></div></div>';

        var st = document.createElement("style");
        st.textContent = "@keyframes stratosSplash{0%{transform:translateX(-115%)}100%{transform:translateX(285%)}}";
        document.head.appendChild(st);

        function poner() {
          if (document.body && !document.getElementById("stratos-splash")) document.body.appendChild(s);
        }
        function sacar() {
          var el = document.getElementById("stratos-splash");
          if (!el) return;
          el.style.opacity = "0";
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
        }
        poner();
        if (!document.body) document.addEventListener("DOMContentLoaded", poner);

        // Se va cuando la app pinta contenido de verdad dentro de #root.
        var root = document.getElementById("root");
        if (root && window.MutationObserver) {
          var obs = new MutationObserver(function () {
            if (root.childElementCount > 0) { obs.disconnect(); sacar(); }
          });
          obs.observe(root, { childList: true });
          if (root.childElementCount > 0) { obs.disconnect(); sacar(); }
        } else {
          // Sin MutationObserver: sondeo simple.
          var iv = setInterval(function () {
            var r = document.getElementById("root");
            if (r && r.childElementCount > 0) { clearInterval(iv); sacar(); }
          }, 250);
          setTimeout(function () { clearInterval(iv); sacar(); }, 30000);
        }
        // Cinturón: si algo sale muy mal, el splash no se queda para siempre
        // tapando el aviso de "La app no terminó de abrir".
        setTimeout(sacar, 32000);
      })();
    </script>

    <!-- ─── Mitigación de crash en Safari iOS ("Ocurrió un problema varias
         veces") ───
         Corre ANTES de la app. Solo pone atributos en <html> que consume
         mobile-perf.css; NUNCA recarga (no crea loops).
           · data-hidden  → pausa animaciones cuando la pestaña está oculta.
           · data-lowfx   → "modo seguro": si la pestaña se cae y recarga ≥3
                            veces en <12s (firma del crash-loop de iOS),
                            quitamos blur + animaciones para que cargue con
                            memoria mínima. Se auto-desactiva al dejar de
                            recargarse. -->
    <script>
      (function () {
        var el = document.documentElement;

        // Tema en <html> ANTES del primer paint: mobile-perf.css lo necesita
        // para que el fondo forzado del modo seguro respete el tema claro
        // (sin esto, las tarjetas quedaban azul-oscuro con texto oscuro).
        // App.jsx lo mantiene en sync al alternar el tema.
        try { el.setAttribute("data-theme", localStorage.getItem("stratos_crm_theme") || "dark"); } catch (e) {}

        // Pausar animaciones cuando la pestaña no está visible (menos repaint
        // en segundo plano → menos presión de memoria en iOS).
        function syncHidden() {
          if (document.hidden) el.setAttribute("data-hidden", "1");
          else el.removeAttribute("data-hidden");
        }
        document.addEventListener("visibilitychange", syncHidden);
        // Safari (macOS) NO siempre dispara "visibilitychange" al VOLVER a la
        // ventana/pestaña, o restaura de bfcache con "pageshow" sin ese evento →
        // data-hidden="1" queda PEGADO y mobile-perf.css congela las animaciones
        // infinitas (átomo, dot "Live", anillo del "Centro de Inteligencia").
        // En focus/pageshow la página SÍ está visible, así que FORZAMOS quitar el
        // flag SIN confiar en document.hidden (que Safari a veces deja "stale" en
        // true). Solo lo quita, nunca lo pone → seguro. (Chrome no lo necesita.)
        function forceShown() { el.removeAttribute("data-hidden"); }
        window.addEventListener("pageshow", forceShown);
        window.addEventListener("focus", forceShown);
        document.addEventListener("visibilitychange", function () { if (!document.hidden) forceShown(); });
        syncHidden();

        // Detector de crash v2 [guard:BOOT-HEALTH] — dos señales + memoria:
        //  a) Loop rápido: ≥3 recargas en <12s (sessionStorage, misma pestaña).
        //  b) Arranques que no llegan a "sano": si la página muere antes de
        //     vivir 15s, cuenta un intento fallido en localStorage. Con ≥3
        //     seguidos (aunque el usuario recargue A MANO minutos después,
        //     que era el hueco de la v1) → modo seguro.
        //  Cualquiera de las dos deja el modo seguro PEGAJOSO por 48h
        //  (stratos_lowfx_until): el iPhone carga plano-pero-estable aunque
        //  siga recargando. Pasadas 48h sin crashes, vuelve solo al look full.
        try {
          var now = Date.now();
          // Claves _v3 (05-ago): el segundo FALSO POSITIVO, y este era grave.
          // La app se recargaba sola 2-3 veces al abrir (SW + vigilante de
          // pantalla en blanco, ver [guard:RELOAD-ARBITER] arriba) → este
          // detector veía "3 recargas en menos de 12s", que es exactamente la
          // firma de un crash-loop de Safari, y clavaba el MODO SEGURO por 48h.
          // O sea: la app se auto-degradaba (sin blur ni animaciones) por un
          // problema que causábamos nosotros, y el usuario se quedaba dos días
          // con la versión fea sin saber por qué. Ahora (a) las recargas
          // propias NO cuentan, y (b) renombrar las claves a _v3 libera AL
          // INSTANTE a las Macs/iPhones que ya quedaron atascados en modo
          // seguro por este bug.
          var LOWFX_UNTIL = "stratos_lowfx_until_v3";
          var BOOT_FAILS = "stratos_boot_fails_v3";
          // Limpieza de las claves viejas: sin esto, un dispositivo atascado
          // arrastra basura de v1/v2 para siempre.
          try {
            localStorage.removeItem("stratos_lowfx_until_v2");
            localStorage.removeItem("stratos_boot_fails_v2");
            localStorage.removeItem("stratos_lowfx_until");
            localStorage.removeItem("stratos_boot_fails");
          } catch (e) {}
          // ¿Esta carga viene de una recarga que pedimos NOSOTROS? Entonces no
          // es un crash: no cuenta ni para el loop rápido ni para los fallos.
          var recargaPropia = !!window.__stratosRecargaPropia;
          var LOWFX_SCOPE = false;
          try {
            LOWFX_SCOPE =
              window.matchMedia("(pointer: coarse), (max-width: 820px)").matches ||
              /iPhone|iPad|iPod|Android/i.test(navigator.userAgent || "");
          } catch (e) {}
          if (!LOWFX_SCOPE) {
            try { localStorage.removeItem(LOWFX_UNTIL); localStorage.removeItem(BOOT_FAILS); } catch (e) {}
            try { sessionStorage.removeItem("stratos_reload_ticks"); } catch (e) {}
            return;
          }
          var stick = 0;
          try { stick = +localStorage.getItem(LOWFX_UNTIL) || 0; } catch (e) {}
          var lowfx = stick > now;

          // (a) loop rápido en la misma pestaña (las recargas propias no cuentan)
          var KEY = "stratos_reload_ticks";
          var ticks = [];
          try { ticks = JSON.parse(sessionStorage.getItem(KEY) || "[]"); } catch (e) {}
          if (!Array.isArray(ticks)) ticks = [];
          if (!recargaPropia) ticks.push(now);
          ticks = ticks.filter(function (t) { return now - t < 12000; });
          try { sessionStorage.setItem(KEY, JSON.stringify(ticks)); } catch (e) {}
          if (ticks.length >= 3) lowfx = true;

          // (b) arranques fallidos consecutivos (sobrevive a recargas manuales)
          var fails = 0;
          try { fails = +localStorage.getItem(BOOT_FAILS) || 0; } catch (e) {}
          if (!recargaPropia) {
            fails += 1;
            try { localStorage.setItem(BOOT_FAILS, String(fails)); } catch (e) {}
          }
          if (fails >= 3) lowfx = true;
          // si la página vive 15s, el arranque fue sano → resetear el contador
          function markHealthy() {
            try { localStorage.setItem(BOOT_FAILS, "0"); } catch (e) {}
          }
          setTimeout(markHealthy, 15000);
          // Un cierre NORMAL tampoco es un crash: al cerrar/ocultar la app o
          // la pestaña disparan pagehide/visibilitychange — un crash real
          // NUNCA los dispara. Sin esto, salir de la app antes de los 15s
          // contaba como intento fallido (falso positivo de la APP nativa).
          window.addEventListener("pagehide", markHealthy);
          document.addEventListener("visibilitychange", function () {
            if (document.hidden) markHealthy();
          });

          if (lowfx) {
            el.setAttribute("data-lowfx", "1");
            try { localStorage.setItem(LOWFX_UNTIL, String(now + 48 * 3600 * 1000)); } catch (e) {}
          }
        } catch (e) { /* sin storage → el modo seguro no auto-activa;
                         el apagado de blur de móvil (CSS puro) igual aplica. */ }
      })();
    </script>
    <!-- ─── [guard:APP-NO-ZOOM] Fijar la APP como app nativa (sin zoom) SIN tocar la WEB ───
         La app es UN SOLO bundle: la MISMA URL corre como sitio web (navegador) y como
         app instalada (PWA en la pantalla de inicio del iPhone / Capacitor APK). En el
         NAVEGADOR el sitio queda 100% zoomeable/accesible (NO se toca — ya está perfecto).
         En la APP instalada queremos que se sienta nativa: sin pinch-zoom ni doble-tap-zoom,
         todo fijo. Detectamos "standalone" (o Capacitor) y SOLO ahí bloqueamos el zoom.
         Reversible: borrar este bloque. -->
    <script>
      (function () {
        function isInstalledApp() {
          try {
            var mm = window.matchMedia;
            return window.navigator.standalone === true ||
              (mm && (mm('(display-mode: standalone)').matches ||
                      mm('(display-mode: fullscreen)').matches ||
                      mm('(display-mode: minimal-ui)').matches)) ||
              !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
          } catch (e) { return false; }
        }
        var locked = false;
        function lockZoom() {
          if (locked || !isInstalledApp()) return;
          locked = true;
          try {
            // iOS: NO tocar el meta viewport — reescribirlo le hace PERDER el
            // viewport-fit=cover y la PWA queda "letterboxed" (franja negra
            // abajo, la app no usa toda la pantalla). En iOS el pinch se
            // bloquea por eventos (abajo). Solo Android/Capacitor reescribe.
            var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var vp = document.querySelector('meta[name="viewport"]');
            if (vp && !isIOS) vp.setAttribute('content',
              'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover');
            // iOS: asegurar viewport-fit=cover SIN reescribir el meta (si algún
            // HTML viejo cacheado no lo trae, se le AÑADE — nunca se reemplaza).
            if (vp && isIOS) {
              var vc = vp.getAttribute('content') || '';
              if (vc.indexOf('viewport-fit') === -1)
                vp.setAttribute('content', vc ? vc + ', viewport-fit=cover' : 'width=device-width, initial-scale=1.0, viewport-fit=cover');
            }
            document.documentElement.setAttribute('data-standalone', '1');
            // HARD-LOCK de app nativa: el DOCUMENTO queda clavado (position:fixed en
            // html/body) → no hay rubber-band ni "franja blanca" abajo: el único scroll
            // es el interno de la app (.stratos-content-area). El fondo respeta el tema
            // por si algún frame expone el html (nunca más blanco).
            var st = document.createElement('style');
            st.textContent =
              'html[data-standalone], html[data-standalone] body {' +
              '  position: fixed; inset: 0; width: 100%; height: 100%;' +
              '  overflow: hidden; overscroll-behavior: none; touch-action: manipulation;' +
              '}' +
              // Nota (v234): el experimento APP-FS-COMP (estirar el lienzo para
              // "usar" la franja inferior) se REVIRTIÓ — la franja está FUERA
              // del WKWebView (iOS la pinta él, negra/blanca según apariencia)
              // y estirar solo empujaba la barra fuera del área visible
              // (IMG_8507). El fix real del recorte: status-bar-style "black"
              // (el letterbox inferior es un bug conocido de black-translucent)
              // — requiere quitar y re-agregar el ícono una vez.
              'html[data-standalone] { background: #030810; }' +
              'html[data-standalone][data-theme="light"] { background: #F1F3F6; }';
            document.head.appendChild(st);
            // iOS IGNORA user-scalable=no (accesibilidad) → bloquear el pinch a mano:
            // (a) eventos gesture* propios de Safari, (b) touchmove con e.scale ≠ 1
            // (la señal de pinch real en iOS). Solo en la app instalada.
            var stop = function (e) { e.preventDefault(); };
            document.addEventListener('gesturestart', stop, { passive: false });
            document.addEventListener('gesturechange', stop, { passive: false });
            document.addEventListener('gestureend', stop, { passive: false });
            document.addEventListener('touchmove', function (e) {
              if (e.scale !== undefined && e.scale !== 1) e.preventDefault();
            }, { passive: false });
            // ── [guard:APP-VIEWPORT-PIN] ── En la PWA de iOS, al abrir el TECLADO
            // WebKit desplaza la VENTANA entera para mostrar el input; al cerrarlo,
            // en apps standalone ese corrimiento a veces QUEDA PEGADO
            // (window.scrollY > 0) → TODA la app corrida hacia arriba: franja
            // muerta bajo la barra inferior ("la barra no está pegada abajo") y
            // contenido metido bajo el reloj. El documento acá es fijo (html/body
            // position:fixed, scroll interno), así que la ventana NUNCA debe
            // quedar desplazada: cuando no hay un input enfocado, se re-ancla a
            // (0,0). Mientras se escribe NO se toca (iOS necesita ese pan para
            // mostrar el campo sobre el teclado).
            var typing = function () {
              var ae = document.activeElement;
              return !!(ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName || '') || ae.isContentEditable));
            };
            var resetWin = function () {
              if (typing()) return;
              try {
                if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
                var se = document.scrollingElement || document.documentElement;
                if (se.scrollTop) se.scrollTop = 0;
                if (se.scrollLeft) se.scrollLeft = 0;
              } catch (e) {}
            };
            window.addEventListener('scroll', resetWin, { passive: true });
            window.addEventListener('pageshow', resetWin);
            window.addEventListener('orientationchange', function () { setTimeout(resetWin, 120); });
            document.addEventListener('focusout', function () { setTimeout(resetWin, 60); setTimeout(resetWin, 300); });
            if (window.visualViewport)
              window.visualViewport.addEventListener('resize', function () { setTimeout(resetWin, 60); });
            resetWin();
          } catch (e) {}
        }
        lockZoom();
        // Capacitor puede inyectar su global un instante después → reintentar al cargar.
        window.addEventListener('DOMContentLoaded', lockZoom);
        window.addEventListener('load', lockZoom);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
