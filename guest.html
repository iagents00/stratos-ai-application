<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Real UI, independently compiled against memory-only guest capabilities.
         Browser-enforced network denial also covers accidental future API calls. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'" />
    <title>Stratos AI · Invitado</title>
  </head>
  <body style="margin:0;background:#060A11">
    <style>
      /* Let enlarged text wrap in the guest notice without covering the CRM.
         vh is the fallback for WebViews that do not implement dvh. */
      #guest-root { display: flex; flex-direction: column; height: 100vh; }
      @supports (height: 100dvh) { #guest-root { height: 100dvh; } }
      .guest-real-workspace { flex: 1; min-height: 0; }
      .guest-real-workspace .stratos-app { height: 100% !important; min-height: 0 !important; }
    </style>
    <div id="guest-root"></div>
    <script type="module" src="/src/guest/main.jsx"></script>
  </body>
</html>
