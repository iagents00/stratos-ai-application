<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{asunto}}</title>
<style>
  /* Deliberadamente sin diseño.
     Un correo con tarjeta, logo y botón se lee como publicidad y se archiva.
     Uno que se ve igual que el que te manda un conocido se lee y se contesta.
     Para 279 personas que ya hablaron con Óscar, esto gana. */
  @media (prefers-color-scheme: dark) {
    .lienzo { background:#0b0f14 !important; }
    .texto  { color:#e6eaf0 !important; }
    /* Los grises secundarios llevan color en línea (para los clientes que
       quitan el <style>) y esta clase, que es la que gana en modo oscuro.
       Sin ella, #444 sobre fondo oscuro queda ilegible. */
    .suave  { color:#a8b2bd !important; }
    .pie    { color:#7c8794 !important; }
    .pie a  { color:#7c8794 !important; }
  }
  @media (max-width:620px) {
    .caja    { width:100% !important; }
    .relleno { padding:26px 20px !important; }
  }
  a { color:#1a5f9e; }
</style>
</head>
<body class="lienzo" style="margin:0;padding:0;background:#ffffff;">

<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<div style="display:none;max-height:0;overflow:hidden;">&#8202;&zwnj;&nbsp;&#8199;&#65279;&#847;&#8202;&zwnj;&nbsp;&#8199;&#65279;&#847;&#8202;&zwnj;&nbsp;&#8199;&#65279;&#847;</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="lienzo" style="background:#ffffff;">
<tr><td align="center" style="padding:26px 0;">
  <table role="presentation" class="caja" width="580" cellpadding="0" cellspacing="0" border="0" style="width:580px;max-width:580px;">
    <tr><td class="relleno texto" style="padding:8px 28px;font:16px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1a1a;">

{{contenido}}

      <p class="pie" style="margin:34px 0 0;padding-top:16px;border-top:1px solid #ececec;font-size:12px;line-height:1.6;color:#999999;">
        {{marca}} · {{direccion_postal}}<br>
        Te escribo a este correo porque pediste información sobre nuestros desarrollos.
        <a href="{{aviso_privacidad_url}}" style="color:#999999;">Aviso de privacidad</a> ·
        <a href="{{unsub_url}}" style="color:#999999;">Ya no quiero recibir correos</a>
      </p>

    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
